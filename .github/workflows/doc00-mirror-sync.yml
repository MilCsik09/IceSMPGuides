name: DOC-00 mirror sync

on:
  push:
    branches:
      - automation/doc00-mirror-sync
    paths:
      - .github/workflows/doc00-mirror-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_URL: https://assets.icesmp.taliann.dev/temporary/doc00-mirror-20260925-13fab018-final.b64

    steps:
      - name: Checkout mirror branch
        uses: actions/checkout@v4
        with:
          ref: automation/doc00-mirror-sync
          fetch-depth: 0

      - name: Download final source-verified bundle
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location "${BUNDLE_URL}?attempt=${attempt}-${GITHUB_RUN_ID}" --output /tmp/doc00-mirror-final.b64; then
              test -s /tmp/doc00-mirror-final.b64
              exit 0
            fi
            sleep 4
          done
          echo "Unable to download DOC-00 mirror bundle" >&2
          exit 1

      - name: Decode, validate and install exact mirror bytes
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          expected = {
              "README.md",
              "ROADMAP.md",
              "docs/ADMIN_GUIDE.md",
              "docs/ARCHITECTURE.md",
              "docs/ARCHITECTURE_FOUNDATION_PLAN.md",
              "docs/BUILDER_GUIDE.md",
              "docs/CONTENT_AUTHORING.md",
              "docs/DOCUMENTATION_AUTHORITY.md",
              "docs/FEATURES.md",
              "docs/LATEST_CHANGES.md",
              "docs/LORE.md",
              "docs/LORE_REFERENCE.md",
              "docs/PLAYER_GUIDE.md",
              "docs/QUESTS.md",
              "docs/RESOURCE_PACK_CMD.md",
              "docs/TEASER.md",
              "docs/TEXTURE_WORKSHEET.md",
              "resource-pack/README.md",
          }
          encoded = Path("/tmp/doc00-mirror-final.b64").read_bytes().strip()
          payload = json.loads(gzip.decompress(base64.b64decode(encoded)).decode("utf-8"))
          if payload.get("format") != "IceSMP-DOC-00-mirror-v1":
              raise SystemExit("Unexpected DOC-00 mirror bundle format")
          files = payload.get("files", {})
          if set(files) != expected:
              missing = sorted(expected - set(files))
              extra = sorted(set(files) - expected)
              raise SystemExit(f"Mirror path mismatch; missing={missing}; extra={extra}")
          for item in sorted(expected):
              entry = files[item]
              data = base64.b64decode(entry["data"], validate=True)
              actual = hashlib.sha256(data).hexdigest()
              if actual != entry["sha256"]:
                  raise SystemExit(f"SHA-256 mismatch for {item}")
              target = Path(item)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              git_blob = hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
              print(f"{item}: sha256={actual} git-blob={git_blob}")
          PY

      - name: Commit byte-identical mirror
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ROADMAP.md docs resource-pack/README.md
          if git diff --cached --quiet; then
            echo "Mirror already synchronized."
            exit 0
          fi
          git diff --cached --check
          git commit -m "docs: synchronize IceSMP DOC-00 authority mirror"
          git push origin HEAD:automation/doc00-mirror-sync
