name: DOC-00 mirror sync

on:
  push:
    branches:
      - automation/doc00-mirror-sync
    paths:
      - .github/workflows/doc00-mirror-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout mirror branch
        uses: actions/checkout@v4
        with:
          ref: automation/doc00-mirror-sync
          fetch-depth: 0

      - name: Copy authoritative Markdown from IceSMP
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: architecture/1.0-docs-authority
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          paths = [
              "README.md",
              "ROADMAP.md",
              "docs/ADMIN_GUIDE.md",
              "docs/ARCHITECTURE.md",
              "docs/ARCHITECTURE_FOUNDATION_PLAN.md",
              "docs/BUILDER_GUIDE.md",
              "docs/CONTENT_AUTHORING.md",
              "docs/DOCUMENTATION_AUTHORITY.md",
              "docs/FEATURES.md",
              "docs/LATEST_CHANGES.md",
              "docs/LORE.md",
              "docs/LORE_REFERENCE.md",
              "docs/PLAYER_GUIDE.md",
              "docs/QUESTS.md",
              "docs/RESOURCE_PACK_CMD.md",
              "docs/TEASER.md",
              "docs/TEXTURE_WORKSHEET.md",
              "resource-pack/README.md",
          ]
          token = os.environ["GH_TOKEN"]
          ref = os.environ["SOURCE_REF"]
          for path in paths:
              encoded_path = urllib.parse.quote(path, safe="/")
              encoded_ref = urllib.parse.quote(ref, safe="")
              url = (
                  "https://api.github.com/repos/MilCsik09/IceSMP/contents/"
                  f"{encoded_path}?ref={encoded_ref}"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "IceSMPGuides-DOC-00-sync",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = json.load(response)
              data = base64.b64decode(payload["content"])
              target = pathlib.Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print(f"synced {path} ({len(data)} bytes)")
          PY

      - name: Commit byte-identical mirror
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ROADMAP.md docs resource-pack/README.md
          if git diff --cached --quiet; then
            echo "Mirror already synchronized."
            exit 0
          fi
          git commit -m "docs: synchronize IceSMP DOC-00 authority mirror"
          git push origin HEAD:automation/doc00-mirror-sync
